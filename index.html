<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 운영 대시보드</title>
<style>
  /* ===== 공통 스타일: 5개 페이지가 같은 값을 쓴다. 바꾸면 모든 파일에 똑같이 반영할 것 ===== */
  :root {
    --color-bg: #faf6f0;
    --color-surface: #ffffff;
    --color-primary: #6f4e37;
    --color-primary-soft: #efe4d8;
    --color-accent: #c8553d;
    --color-text: #2f2520;
    --color-muted: #7a6b60;
    --color-border: #e6dccf;
    --font-base: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --radius: 12px;
  }
  /* ===== 공통 스타일 끝 ===== */

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-base);
    font-size: 16px;
    line-height: 1.5;
  }

  .app {
    display: grid;
    grid-template-columns: 230px 1fr;
    height: 100%;
  }

  /* 왼쪽 메뉴 */
  .sidebar {
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
  }
  .brand { padding: 0 8px; }
  .brand strong { display: block; font-size: 22px; color: var(--color-primary); }
  .brand span { font-size: 14px; color: var(--color-muted); }

  .menu { display: flex; flex-direction: column; gap: 6px; }
  .menu a {
    display: block;
    padding: 13px 16px;
    border-radius: 10px;
    color: var(--color-text);
    font-size: 17px;
    text-decoration: none;
  }
  .menu a:hover { background: var(--color-primary-soft); }
  .menu a[aria-current="page"] {
    background: var(--color-primary);
    color: #fff;
    font-weight: 700;
  }
  .menu a:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }

  /* 가운데 화면 */
  .content { min-width: 0; min-height: 0; position: relative; }
  .frame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--color-bg);
  }

  .home { height: 100%; overflow-y: auto; padding: 32px; }
  .home h1 { margin: 0 0 4px; font-size: 26px; }
  .home p { margin: 0; color: var(--color-muted); }
  .placeholder {
    margin-top: 24px;
    padding: 40px 24px;
    background: var(--color-surface);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    text-align: center;
    color: var(--color-muted);
  }

  /* 홈: 숫자 카드 */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 24px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 18px 20px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
  }
  .stat-label { font-size: 14px; color: var(--color-muted); }
  .stat-value { font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat-note { min-height: 1.5em; font-size: 14px; color: var(--color-muted); }
  .stat.warn { border-color: var(--color-accent); }
  .stat.warn .stat-value { color: var(--color-accent); }

  /* 홈: 7일 매출 그래프 (div로 직접 그린다) */
  .panel {
    margin-top: 12px;
    padding: 20px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
  }
  .panel h2 { margin: 0 0 16px; font-size: 18px; }
  .chart {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    height: 240px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .chart li { display: flex; flex-direction: column; min-width: 0; }
  .chart .val {
    font-size: 13px;
    text-align: center;
    color: var(--color-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .chart .bar-area { position: relative; flex: 1; border-bottom: 1px solid var(--color-border); }
  .chart .bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: color-mix(in srgb, var(--color-primary) 65%, white);
    border-radius: 6px 6px 0 0;
  }
  .chart .day { padding-top: 6px; font-size: 13px; line-height: 1.3; text-align: center; color: var(--color-muted); }
  .chart li.today .bar { background: var(--color-primary); }
  .chart li.today .val,
  .chart li.today .day { color: var(--color-text); font-weight: 700; }

  .home-status { margin-top: 16px; min-height: 1.5em; color: var(--color-muted); }
  .home-status.error { color: var(--color-accent); font-weight: 700; }

  /* 좁은 화면: 메뉴를 위로 */
  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar {
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-right: 0;
      border-bottom: 1px solid var(--color-border);
      overflow-x: auto;
      overflow-y: hidden;
    }
    .brand span { display: none; }
    .brand strong { font-size: 18px; white-space: nowrap; }
    .menu { flex-direction: row; }
    .menu a { padding: 10px 14px; font-size: 15px; white-space: nowrap; }
    .home { padding: 20px 16px; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <strong>골목카페</strong>
        <span>운영 대시보드</span>
      </div>
      <nav class="menu" aria-label="메뉴">
        <a href="#home" data-page="home">홈</a>
        <a href="#sales" data-page="sales">매출</a>
        <a href="#menu" data-page="menu">메뉴·재고</a>
        <a href="#reviews" data-page="reviews">리뷰</a>
        <a href="#promo" data-page="promo">홍보</a>
      </nav>
    </aside>

    <main class="content">
      <!-- 홈: 숫자 카드와 7일 매출 그래프 -->
      <section class="home" id="home">
        <h1>오늘의 가게</h1>
        <p id="todayLabel"></p>

        <div class="cards">
          <div class="stat">
            <span class="stat-label">오늘 매출</span>
            <strong class="stat-value" id="statSales">–</strong>
          </div>
          <div class="stat">
            <span class="stat-label">오늘 판매 건수</span>
            <strong class="stat-value" id="statCount">–</strong>
          </div>
          <div class="stat" id="statLowCard">
            <span class="stat-label">재고 부족 메뉴</span>
            <strong class="stat-value" id="statLow">–</strong>
            <span class="stat-note" id="statLowNote"></span>
          </div>
        </div>

        <div class="panel">
          <h2>최근 7일 매출</h2>
          <ol class="chart" id="chart" aria-label="최근 7일 날짜별 매출"></ol>
        </div>

        <div class="home-status" id="homeStatus" role="status" aria-live="polite"></div>
      </section>

      <!-- 아직 만들지 않은 페이지를 눌렀을 때 -->
      <section class="home" id="soon" hidden>
        <h1 id="soonTitle"></h1>
        <div class="placeholder">준비 중입니다.</div>
      </section>

      <!-- 나머지 4개 메뉴는 이 iframe에서 열린다 -->
      <iframe class="frame" id="frame" title="화면" hidden></iframe>
    </main>
  </div>

<script>
  const PAGES = {
    home: null,
    sales: "sales.html",
    menu: "menu.html",
    reviews: "reviews.html",
    promo: "promo.html"
  };

  const links = document.querySelectorAll(".menu a");
  const home = document.getElementById("home");
  const soon = document.getElementById("soon");
  const soonTitle = document.getElementById("soonTitle");
  const frame = document.getElementById("frame");
  let latest = 0;

  // Supabase 프로젝트 주소와 공개용(anon/publishable) 키. 비밀 키(service role)는 절대 넣지 않는다.
  const SUPABASE_URL = "https://fcfeyfkjnitinwdgnjqg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_yP7jI9WjuJzenQDGPu106A_BOf34awW";
  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  let homeLatest = 0;

  function won(n) { return n.toLocaleString("ko-KR") + "원"; }
  // 그래프 칸이 좁아서 1만 이상은 「1.2만」처럼 줄여 쓴다.
  function compactWon(n) {
    return n >= 10000 ? (Math.round(n / 1000) / 10).toLocaleString("ko-KR") + "만" : n.toLocaleString("ko-KR");
  }
  function dayKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  async function api(path, options = {}) {
    let res;
    try {
      res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
        ...options,
        headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...(options.headers || {}) }
      });
    } catch (e) {
      throw new Error("서버에 연결하지 못했습니다. 인터넷 연결과 Supabase 주소를 확인하세요.");
    }
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).message || ""; } catch (e) {}
      throw new Error(detail || "요청에 실패했습니다 (" + res.status + ")");
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  function renderCards(todaySales, menus) {
    document.getElementById("statSales").textContent = won(todaySales.total);
    document.getElementById("statCount").textContent = todaySales.cnt + "건";

    const low = menus.filter(m => m.stock <= m.low_stock_threshold);
    document.getElementById("statLow").textContent = low.length + "개";
    document.getElementById("statLowCard").classList.toggle("warn", low.length > 0);
    const names = low.slice(0, 3).map(m => m.name).join(", ");
    document.getElementById("statLowNote").textContent =
      low.length > 0 ? names + (low.length > 3 ? " 외 " + (low.length - 3) + "개" : "")
      : menus.length > 0 ? "모든 메뉴 재고 충분" : "등록된 메뉴 없음";
  }

  function renderChart(series) {
    const max = Math.max(...series.map(s => s.total));
    document.getElementById("chart").replaceChildren(...series.map((s, i) => {
      const isToday = i === series.length - 1;
      const weekday = WEEKDAYS[s.date.getDay()];
      const li = document.createElement("li");
      if (isToday) li.className = "today";
      li.title = (s.date.getMonth() + 1) + "월 " + s.date.getDate() + "일 (" + weekday + ") " + won(s.total) + " · " + s.cnt + "건";

      const val = document.createElement("span");
      val.className = "val";
      val.textContent = compactWon(s.total);

      const area = document.createElement("div");
      area.className = "bar-area";
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.setAttribute("aria-hidden", "true");
      bar.style.height = max > 0 && s.total > 0 ? Math.max((s.total / max) * 100, 2) + "%" : "0";
      area.append(bar);

      const day = document.createElement("span");
      day.className = "day";
      day.append(isToday ? "오늘" : (s.date.getMonth() + 1) + "/" + s.date.getDate(), document.createElement("br"), weekday);

      li.append(val, area, day);
      return li;
    }));
  }

  // 홈을 보여 줄 때마다 최신 숫자를 다시 불러온다.
  async function loadHome() {
    const mine = ++homeLatest;
    const status = document.getElementById("homeStatus");
    const now = new Date();
    document.getElementById("todayLabel").textContent =
      now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + WEEKDAYS[now.getDay()] + "요일";

    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - i);
      days.push(d);
    }

    status.className = "home-status";
    status.textContent = "불러오는 중...";
    try {
      const [rows, menus] = await Promise.all([
        api("rpc/sales_by_day", {
          method: "POST",
          body: JSON.stringify({
            p_from: days[0].toISOString(),
            p_tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Seoul"
          })
        }),
        api("menu_items?select=name,stock,low_stock_threshold&order=id.asc")
      ]);
      if (mine !== homeLatest) return;

      const byDay = new Map(rows.map(r => [r.day, r]));
      const series = days.map(d => {
        const r = byDay.get(dayKey(d));
        return { date: d, total: r ? r.total : 0, cnt: r ? r.cnt : 0 };
      });
      renderCards(series[series.length - 1], menus);
      renderChart(series);
      status.textContent = "";
    } catch (err) {
      if (mine !== homeLatest) return;
      status.textContent = err.message;
      status.classList.add("error");
    }
  }

  // 파일이 아직 없으면(404) false. 파일을 직접 연 경우처럼 확인할 수 없으면 true로 보고 그냥 연다.
  async function pageExists(url) {
    try {
      const res = await fetch(url, { method: "HEAD" });
      return res.ok;
    } catch (e) {
      return true;
    }
  }

  async function show() {
    const mine = ++latest;
    let key = location.hash.slice(1);
    if (!(key in PAGES)) key = "home";

    links.forEach(a => {
      if (a.dataset.page === key) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });

    if (key === "home") {
      home.hidden = false;
      soon.hidden = true;
      frame.hidden = true;
      loadHome();
      return;
    }

    const label = document.querySelector('.menu a[data-page="' + key + '"]').textContent;
    const exists = await pageExists(PAGES[key]);
    if (mine !== latest) return; // 기다리는 사이 다른 메뉴를 눌렀다

    home.hidden = true;
    soon.hidden = exists;
    frame.hidden = !exists;
    if (exists) {
      frame.title = label;
      frame.src = PAGES[key];
    } else {
      soonTitle.textContent = label;
    }
  }

  window.addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
