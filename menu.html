<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴·재고</title>
<style>
  /* ===== 공통 스타일: 5개 페이지가 같은 값을 쓴다. 바꾸면 모든 파일에 똑같이 반영할 것 ===== */
  :root {
    --color-bg: #faf6f0;
    --color-surface: #ffffff;
    --color-primary: #6f4e37;
    --color-primary-soft: #efe4d8;
    --color-accent: #c8553d;
    --color-text: #2f2520;
    --color-muted: #7a6b60;
    --color-border: #e6dccf;
    --font-base: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --radius: 12px;
  }
  /* ===== 공통 스타일 끝 ===== */

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    padding: 32px;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-base);
    font-size: 16px;
    line-height: 1.5;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .sub { margin: 0; color: var(--color-muted); }

  .card {
    margin-top: 24px;
    padding: 20px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
  }

  /* 입력칸 */
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .field label { display: block; margin-bottom: 4px; font-size: 14px; color: var(--color-muted); }
  .field input {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--color-text);
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 8px;
  }
  .field input:focus-visible,
  button:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }

  /* 버튼 */
  button {
    padding: 10px 18px;
    font: inherit;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid var(--color-primary);
    background: var(--color-primary);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: transparent; color: var(--color-accent); border-color: var(--color-accent); }
  .actions { display: flex; gap: 8px; margin-top: 14px; }

  /* 목록 */
  .summary { margin: 24px 0 0; color: var(--color-muted); }
  .list { display: grid; gap: 12px; margin-top: 12px; }
  .item {
    padding: 16px 20px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
  }
  .item.low { border-color: var(--color-accent); }
  .item.low input[id^="stock-"] { color: var(--color-accent); border-color: var(--color-accent); font-weight: 700; }
  .badge {
    display: inline-block;
    margin-bottom: 10px;
    padding: 2px 10px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--color-accent);
    border-radius: 999px;
  }

  /* 안내 문구 */
  .status { margin-top: 16px; min-height: 1.5em; color: var(--color-muted); }
  .status.error { color: var(--color-accent); font-weight: 700; }
  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--color-muted);
    background: var(--color-surface);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
  }

  @media (max-width: 640px) {
    body { padding: 20px 16px; }
    .card, .item { padding: 16px; }
  }
</style>
</head>
<body>
  <h1>메뉴·재고</h1>
  <p class="sub">메뉴와 가격, 남은 재고를 관리합니다.</p>

  <form class="card" id="addForm">
    <h2>메뉴 추가</h2>
    <div class="fields">
      <div class="field"><label for="addName">메뉴 이름</label><input id="addName" type="text" maxlength="40" required></div>
      <div class="field"><label for="addPrice">가격(원)</label><input id="addPrice" type="number" min="0" step="1" value="0" required></div>
      <div class="field"><label for="addStock">재고</label><input id="addStock" type="number" min="0" step="1" value="0" required></div>
      <div class="field"><label for="addLow">부족 기준</label><input id="addLow" type="number" min="0" step="1" value="5" required></div>
    </div>
    <div class="actions"><button type="submit" id="addBtn">추가</button></div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <p class="summary" id="summary" hidden></p>
  <div class="list" id="list"></div>

<script>
  // Supabase 프로젝트 주소와 공개용(anon/publishable) 키를 넣는다. 비밀 키(service role)는 절대 넣지 않는다.
  const SUPABASE_URL = "https://fcfeyfkjnitinwdgnjqg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_yP7jI9WjuJzenQDGPu106A_BOf34awW";
  const TABLE = "menu_items";

  const configured = !SUPABASE_URL.includes("여기에") && !SUPABASE_KEY.includes("여기에");
  const listEl = document.getElementById("list");
  const summaryEl = document.getElementById("summary");
  const statusEl = document.getElementById("status");
  const addForm = document.getElementById("addForm");
  const addBtn = document.getElementById("addBtn");

  let items = [];

  function setStatus(message, isError) {
    statusEl.textContent = message || "";
    statusEl.classList.toggle("error", Boolean(isError));
  }

  async function api(path, options = {}) {
    let res;
    try {
      res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
        ...options,
        headers: {
          apikey: SUPABASE_KEY,
          "Content-Type": "application/json",
          Prefer: "return=representation",
          ...(options.headers || {})
        }
      });
    } catch (e) {
      throw new Error("서버에 연결하지 못했습니다. 인터넷 연결과 Supabase 주소를 확인하세요.");
    }
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).message || ""; } catch (e) {}
      throw new Error(detail || "요청에 실패했습니다 (" + res.status + ")");
    }
    return res.json();
  }

  function isLow(item) { return item.stock <= item.low_stock_threshold; }

  function updateSummary() {
    summaryEl.hidden = items.length === 0;
    const low = items.filter(isLow).length;
    summaryEl.textContent = "메뉴 " + items.length + "개 · 재고 부족 " + low + "개";
    if (items.length === 0 && !listEl.querySelector(".empty")) renderEmpty();
  }

  function renderEmpty() {
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = "등록된 메뉴가 없습니다. 위에서 첫 메뉴를 추가해 보세요.";
    listEl.replaceChildren(div);
  }

  function makeField(id, label, type, value, extra) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const l = document.createElement("label");
    l.htmlFor = id;
    l.textContent = label;
    const input = document.createElement("input");
    input.id = id;
    input.type = type;
    input.value = value;
    input.required = true;
    Object.assign(input, extra);
    wrap.append(l, input);
    return { wrap, input };
  }

  function readNumber(input, label) {
    const n = Number(input.value);
    if (input.value === "" || !Number.isInteger(n) || n < 0) {
      throw new Error(label + "은(는) 0 이상의 정수로 입력하세요.");
    }
    return n;
  }

  function makeCard(item) {
    const form = document.createElement("form");
    form.className = "item" + (isLow(item) ? " low" : "");

    if (isLow(item)) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = item.stock === 0 ? "품절" : "재고 부족";
      form.append(badge);
    }

    const fields = document.createElement("div");
    fields.className = "fields";
    const name = makeField("name-" + item.id, "메뉴 이름", "text", item.name, { maxLength: 40 });
    const price = makeField("price-" + item.id, "가격(원)", "number", item.price, { min: 0, step: 1 });
    const stock = makeField("stock-" + item.id, "재고", "number", item.stock, { min: 0, step: 1 });
    const low = makeField("low-" + item.id, "부족 기준", "number", item.low_stock_threshold, { min: 0, step: 1 });
    fields.append(name.wrap, price.wrap, stock.wrap, low.wrap);

    const actions = document.createElement("div");
    actions.className = "actions";
    const saveBtn = document.createElement("button");
    saveBtn.type = "submit";
    saveBtn.textContent = "저장";
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "ghost";
    delBtn.textContent = "삭제";
    actions.append(saveBtn, delBtn);

    form.append(fields, actions);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = delBtn.disabled = true;
      try {
        const body = {
          name: name.input.value.trim(),
          price: readNumber(price.input, "가격"),
          stock: readNumber(stock.input, "재고"),
          low_stock_threshold: readNumber(low.input, "부족 기준")
        };
        if (!body.name) throw new Error("메뉴 이름을 입력하세요.");
        const rows = await api(TABLE + "?id=eq." + item.id, { method: "PATCH", body: JSON.stringify(body) });
        if (rows.length === 0) throw new Error("저장되지 않았습니다. 이미 삭제된 메뉴일 수 있습니다.");
        items = items.map(i => (i.id === item.id ? rows[0] : i));
        form.replaceWith(makeCard(rows[0]));
        updateSummary();
        setStatus("'" + rows[0].name + "' 저장했습니다.");
      } catch (err) {
        setStatus(err.message, true);
        saveBtn.disabled = delBtn.disabled = false;
      }
    });

    delBtn.addEventListener("click", async () => {
      if (!confirm("'" + item.name + "' 메뉴를 삭제할까요?")) return;
      saveBtn.disabled = delBtn.disabled = true;
      try {
        const rows = await api(TABLE + "?id=eq." + item.id, { method: "DELETE" });
        if (rows.length === 0) throw new Error("삭제되지 않았습니다.");
        items = items.filter(i => i.id !== item.id);
        form.remove();
        updateSummary();
        setStatus("'" + item.name + "' 삭제했습니다.");
      } catch (err) {
        setStatus(err.message, true);
        saveBtn.disabled = delBtn.disabled = false;
      }
    });

    return form;
  }

  function renderList() {
    if (items.length === 0) renderEmpty();
    else listEl.replaceChildren(...items.map(makeCard));
    updateSummary();
  }

  async function load() {
    setStatus("불러오는 중...");
    try {
      items = await api(TABLE + "?select=*&order=id.asc");
      setStatus("");
      renderList();
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  addForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    addBtn.disabled = true;
    try {
      const body = {
        name: document.getElementById("addName").value.trim(),
        price: readNumber(document.getElementById("addPrice"), "가격"),
        stock: readNumber(document.getElementById("addStock"), "재고"),
        low_stock_threshold: readNumber(document.getElementById("addLow"), "부족 기준")
      };
      if (!body.name) throw new Error("메뉴 이름을 입력하세요.");
      const rows = await api(TABLE, { method: "POST", body: JSON.stringify(body) });
      items.push(rows[0]);
      renderList();
      addForm.reset();
      document.getElementById("addName").focus();
      setStatus("'" + rows[0].name + "' 추가했습니다.");
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      addBtn.disabled = false;
    }
  });

  if (configured) {
    load();
  } else {
    addBtn.disabled = true;
    setStatus("파일 위쪽의 SUPABASE_URL과 SUPABASE_KEY에 Supabase 주소와 공개 키를 넣어야 합니다.", true);
  }
</script>
</body>
</html>
